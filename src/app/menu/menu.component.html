<header>
  @if (!estMenuVisible) {
    <button type="button" class="btn-menu" (click)="afficherMenu()" aria-label="Afficher le menu mobile">Menu</button>
  } @if (estMenuVisible) {
    <button type="button" class="btn-menu" (click)="masquerMenu()" aria-label="Masquer le menu mobile">Masquer</button>
  }
  <menu
    [ngClass]="{
    'masque': !estMenuVisible,
    'affiche': estMenuVisible,
  }"
  >
    <li class="btn menu-elem" (click)="allerVers('evenement')">Evenement</li>
    <li class="btn menu-elem" (click)="allerVers('inscrits')">Inscrits</li>
    <li class="btn menu-elem" (click)="allerVers('poules')">Poules</li>
    <li class="btn menu-elem" (click)="allerVers('matchs')">Matchs</li>
    @if (role=='admin') {
      <li>|</li>
      <li class="btn menu-elem" (click)="allerVers('annuaire')">Annuaire</li>
      <li class="btn menu-elem" (click)="allerVers('clubs')">Clubs</li>
      <li class="btn menu-elem" (click)="allerVers('referentiels')">Référentiels</li>
    }
  </menu>
<div class="btn" id="login">
    <app-login></app-login>
</div>
</header>
