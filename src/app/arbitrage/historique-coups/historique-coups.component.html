<section id="historique">
  <h2>Historique des coups</h2>
  <table id="table-coups">
    @for (echange of listeCoups; track $index) {
    <tr class="ligne-coup">
      <td class="detailsEchange">
        <app-ligne-coup [echange]="echange"></app-ligne-coup>
      </td>
       @if (Auth.estArbitre(role)) {
        <td class="deleteEchange">
          <span class="btn-histo-coup-supprimer" (click)="supprimerCoup(echange.id)">X</span>
        </td>
      }
    </tr>
    }
  </table>
</section>
