<main>
  @if (match) {
    <div>Statut : {{ match.statut }}</div>
    <app-gestion-match
      [match]="match"
      (matchEvent)="refreshMatch()"
    ></app-gestion-match>
    <div id="separateur"></div>
    <section id="echanges">
      <app-saisie-echange [match]="match"></app-saisie-echange>
      <app-historique-coups
        [role]="role"
        [matchId]="match.id">
      </app-historique-coups>
    </section>
  } @else {
    <section>Chargement du match</section>
  }
</main>
