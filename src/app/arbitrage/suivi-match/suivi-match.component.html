<section id="section-suivi">
  <app-inscrit-match
    id="inscrit-a"
    class="inscrit"
    [inscrit]="match.inscritA"
    couleur="rgb(68, 143, 255)"
  ></app-inscrit-match>
  <app-score-inscrit-match
    id="score-a"
    [score]="match.scoreA"
    couleur="rgb(68, 143, 255)"
    (scoreEvent)="updateScoreA($event)"
  ></app-score-inscrit-match>
  <app-chrono
    id="chrono"
    [match]="match"
    (timerEvent)="updateTimer($event)"
    (timerFinEvent)="saisirFinMatch()"
    (timerDebutEvent)="setDebutMatch()"
  ></app-chrono>
  <app-score-inscrit-match
    id="score-b"
    [score]="match.scoreB"
    couleur="rgb(189, 152, 32)"
    (scoreEvent)="updateScoreB($event)"
  ></app-score-inscrit-match>
  <app-inscrit-match
    id="inscrit-b"
    class="inscrit"
    [inscrit]="match.inscritB"
    couleur="rgb(189, 152, 32)"
  ></app-inscrit-match>
</section>

@if (estModaleSaisieVisible){
  <app-fin-match-modal
    [a]="match.inscritA"
    [b]="match.inscritB"
    (annuler)="annulerSaisieFinMatch()"
    (matchNull)="enregistrerMatchNull($event)"
    (resultat)="enregistrerVainqueurMatch($event)"
  ></app-fin-match-modal>
}
