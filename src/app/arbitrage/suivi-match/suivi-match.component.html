<section id="section-suivi">
  <app-inscrit-match
    id="inscrit-a"
    class="inscrit"
    [inscrit]="match.infosA"
    [couleur]="match.couleurA"
  ></app-inscrit-match>
  <app-score-inscrit-match
    id="score-a"
    [score]="match.scoreA"
    [couleur]="match.couleurA"
    (scoreEvent)="updateScoreA($event)"
  ></app-score-inscrit-match>
  <app-chrono
    id="chrono"
    [match]="match"
    (timerEvent)="updateTimer($event)"
    (timerDebutEvent)="setDebutMatch()"
    (timerFinEvent)="setFinMatch($event)"
  ></app-chrono>
  <app-score-inscrit-match
    id="score-b"
    [score]="match.scoreB"
    [couleur]="match.couleurB"
    (scoreEvent)="updateScoreB($event)"
  ></app-score-inscrit-match>
  <app-inscrit-match
    id="inscrit-b"
    class="inscrit"
    [inscrit]="match.infosB"
    [couleur]="match.couleurB"
  ></app-inscrit-match>
</section>
