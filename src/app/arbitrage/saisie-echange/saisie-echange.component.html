<form [formGroup]="formSaisieEchange" (ngSubmit)="onValider()">
  <p>
    <label for="type-echange">Type de l'échange</label>
    <select formControlName="typeEchange">
      <option [ngValue]="null" hidden selected></option>
      @for (item of match.ruleset.typesEchange; track $index){
        <option [ngValue]=item>{{ item.libelle }}</option>
      }
    </select>
  </p>

  @if (labelAttaquant) {
    <p>
      <label for="attaquant">{{labelAttaquant}}</label>
      <select formControlName="attaquant">
        <option hidden selected></option>
        <option [ngValue]=match.inscritA>{{ match.inscritA.prenom }}</option>
        <option [ngValue]=match.inscritB>{{ match.inscritB.prenom }}</option>
      </select>
    </p>  
  }
  @if (echangeTemp.inscritA && echangeTemp.inscritB){
    <label for="coup-a">Saisir la touche de : {{echangeTemp.inscritA.prenom}} {{echangeTemp.inscritA.nom}}</label>
    <div formGroupName="coupA">
      <label for="vulnerant-a">Vulnérant</label>
      <select formControlName="vulnerant">
        <option [ngValue]="null" hidden selected></option>
        @for (item of match.ruleset.vulnerants; track $index){
          <option [ngValue]=item>{{ item.code }}</option>
        }
      </select>

      <label for="cible-a">Cible</label>
      <select formControlName="cible">
        <option [ngValue]="null" hidden selected></option>
        @for (item of match.ruleset.cibles; track $index){
          <option [ngValue]=item>{{ item.code }}</option>
        }
      </select>
    </div>

  @if (hasCoupDef) {
    <label for="coup-b">Saisir la touche de : {{echangeTemp.inscritB.prenom}} {{echangeTemp.inscritB.nom}}</label>
    <div formGroupName="coupB">
      <label for="vulnerant-b">Vulnérant</label>
      <select formControlName="vulnerant">
        <option [ngValue]="null" hidden selected></option>
        @for (item of match.ruleset.vulnerants; track $index){
          <option [ngValue]=item>{{ item.code }}</option>
        }
      </select>

      <label for="cible-b">Cible</label>
      <select formControlName="cible">
        <option [ngValue]="null" hidden selected></option>
        @for (item of match.ruleset.cibles; track $index){
          <option [ngValue]=item>{{ item.code }}</option>
        }
      </select>
    </div>
  }
}
  <!-- <button type="submit" [disabled]="formulaireErreur">Enregistrer échange</button> -->
  <button id="submitButton" type='submit'>Enregistrer échange</button>
</form>
