<form>
    <p>
      <label for="">Type d'échange</label>
      <select (change)="onSelectItem($event, 'type')">
        <option hidden selected></option>
        @for (item of match.ruleset.typesEchange; track $index){
          <option [value]=item.id>{{ item.code }}</option>
        }
      </select>
    </p>

    <p>
      <label for="">Qui porte le coup ?</label>
      <select (change)="onSelectItem($event, 'attaquant')">
        <option hidden selected></option>
        <option [value]=match.inscritA.id>{{ match.inscritA.prenom }}</option>
        <option [value]=match.inscritB.id>{{ match.inscritB.prenom }}</option>
      </select>
    </p>
  
    <p>
      <label for="">Vulnérant de A</label>
      <select (change)="onSelectItem($event, 'vulnerant_a')">
        <option hidden selected></option>
        @for (item of match.ruleset.vulnerants; track $index){
          <option [value]=item.id>{{ item.code }}</option>
        }
      </select>
    </p>

    <p>
      <label for="">Cible de A</label>
      <select (change)="onSelectItem($event, 'cible_a')">
        <option hidden selected></option>
        @for (item of match.ruleset.cibles; track $index){
          <option [value]=item.id>{{ item.code }}</option>
        }
      </select>
    </p>
    <p>{{toucheClean}}</p>

    @if (!toucheClean) {
      <p>
        <label for="">Vulnérant de B</label>
        <select (change)="onSelectItem($event, 'vulnerant_b')">
          <option hidden selected></option>
          @for (item of match.ruleset.vulnerants; track $index){
            <option [value]=item.id>{{ item.code }}</option>
          }
        </select>
      </p>
  
      <p>
        <label for="">Cible de B</label>
        <select (change)="onSelectItem($event, 'cible_b')">
          <option hidden selected></option>
          @for (item of match.ruleset.cibles; track $index){
            <option [value]=item.id>{{ item.code }}</option>
          }
        </select>
      </p>  
    }

    <!-- <button type="submit" [disabled]="formulaireErreur">Enregistrer échange</button> -->
    <button type='button' (click)="onValider()" >Enregistrer échange</button>
  </form>

  @if (echanges.length) {
    @for (e of echanges; track $index) {
      <p>{{e.inscritA.prenom}} frappe {{e.inscritB.prenom}} {{e.vulnerantA.libelle }} {{e.cibleA.libelle}}</p>
    }  
    <div>{{echanges.length}}</div>
  }
  <div>{{echanges.length}}</div>
