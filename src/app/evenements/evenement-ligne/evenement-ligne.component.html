@if (estModif) {
<app-evenement-editer
  [estPair]="estPair"
  [evenement]="evenement"
  (annulerEditionCreation)="modifEvenementAnnulee()"
  (supprimerEvenement)="suppressionEvenement($event)"
  (validerEdition)="modifEvenementTerminee($event)"
></app-evenement-editer>
} @else {
<app-evenement-afficher
  [estPair]="estPair"
  [evenement]="evenement"
  [role]="role"
  (editerEvenement)="lancerEdition()"
></app-evenement-afficher>
}
