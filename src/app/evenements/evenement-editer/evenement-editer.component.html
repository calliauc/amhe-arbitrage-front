<form
  [formGroup]="formEditerEvenement"
  (ngSubmit)="confirmer()"
  (keypress.enter)="confirmer()"
  (keypress.escape)="annuler()"
>
  <tr [ngClass]="{ lignePair: estPair }">
    <td id="col-nom" class="col">
      <input
        class="input-txt"
        type="text"
        formControlName="nom"
        placeholder="Nom"
        #focus
      />
    </td>
    <td id="col-description" class="col">
      <input
        class="input-txt"
        type="text"
        formControlName="description"
        placeholder="Description"
      />
    </td>
    <td id="col-dates" class="col">
      <div id="col-dates-txt">
        <div>Début : </div>
        <div>Fin : </div>
      </div>
      <div id="col-dates-inputs">
        <input
        class="input-label"
        type="date"
        formControlName="dateDebut"
        />
        <input
          class="input-txt"
          type="date"
          formControlName="dateFin"
        />
      </div>
    </td>
    <td id="col-ruleset" class="col">
       @if (evenement.ruleset?.id) {
        {{evenement.ruleset.nom}}
       } @else {
        <select name="ruleset" formControlName="ruleset">
          @for (ruleset of rulesetListe; track $index){
          <option [ngValue]="ruleset">{{ ruleset.nom }}</option>
          }
        </select>  
       }
    </td>
    <td id="col-inscrits" class="col">
      @if (evenement.id){
        <button
          type="button"
          class="btn btn-evenements btn-suppression"
          (click)="demanderSuppression()"
        >
          X</button
        >}
  
    </td>
    <td id="col-buttons" class="col">
      <button class="btn btn-evenements btn-enregistrer-edition" type="submit">
        Enregistrer
      </button>
      <button
        type="button"
        class="btn btn-evenements btn-annuler-edition"
        (click)="annuler()"
      >
        Annuler
      </button>
    </td>
  </tr>
  <div>
    
  </div>
  @if (ereurSaisie){
  <div class="bandeau-erreur">
    <div class="message-erreur">Certains champs sont vides</div>
  </div>
  }
</form>
@if (estModalVisible && evenement.id){
<app-confirmation-modal
  [id]="evenement.id"
  [titre]="titreModal"
  [texte]="texteModal"
  (confirmer)="confirmerSuppression($event)"
  (annuler)="annulerSuppression()"
></app-confirmation-modal>
}
