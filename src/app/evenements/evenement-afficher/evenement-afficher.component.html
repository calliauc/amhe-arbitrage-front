<tr [ngClass]="{ lignePair: estPair }">
  <td id="col-nom" class="col">{{ evenement.nom }}</td>
  <td id="col-description" class="col">{{ evenement.description }}</td>
  <td id="col-dates" class="col">{{ evenement.dateDebut  | date:'shortDate' }} - {{ evenement.dateFin | date:'shortDate' }}</td>
  <td id="col-ruleset" class="col">{{ evenement.ruleset?.nom }}</td>
  <td id="col-inscrits" class="col">{{ evenement.inscrits?.length }}</td>
  <div id="col-buttons">
    <button
      class="btn btn-evenements btn-afficher-details"
      (click)="onDetails(evenement)"
    >
      Charger
    </button>
     @if (Auth.estAdmin(role)) {
    <button
      class="btn btn-evenements btn-editer-evenement"
      (click)="editer()"
    >
      Editer</button
    >}
  </div>
</tr>
