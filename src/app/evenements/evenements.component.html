<main>
  <table>
    <thead>
      <tr>
        <th id="col-nom" class="col">Nom</th>
        <th id="col-description" class="col">Description</th>
        <th id="col-dates" class="col">Dates</th>
        <th id="col-ruleset" class="col">Règles</th>
        <th id="col-inscrits" class="col">Inscrits</th>
        <th id="col-buttons" class="col"></th>
      </tr>
    </thead>
    @for (evenement of evenementsListe$ | async; track $index; let estPair =
    $even) {
    <app-evenement-ligne
      (supprimerEvenement)="supprimerEvenement($event)"
      (modifierEvenement)="modifierEvenement($event)"
      [estPair]="estPair"
      [evenement]="evenement"
      [role]="role"
    ></app-evenement-ligne>
    } @if (estModeCreation) {
    <app-evenement-editer
      (annulerEditionCreation)="annulerEdition()"
      (validerCreation)="creerEvenement()"
    ></app-evenement-editer>
    }
  </table>
  @if (!estModeCreation && Auth.estAdmin(role)) {
  <button class="btn" id="ajouter-evenement" (click)="modeAjout()">
    Ajouter evenement
  </button>
  }
</main>
