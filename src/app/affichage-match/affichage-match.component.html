<main>
  @if (match) {
  <div id="status">Statut du match : {{ match.statut }}</div>
  <div>
  <button class="btn" id="btn-refresh" (click)="refreshMatch()">
    Actualiser affichage
  </button>
  @if (Auth.estArbitre(role)) {
    <button class="btn" id="btn-arbitrage" (click)="arbitrerMatch()">
      Arbitrer le match
    </button>
  }
  </div>
  <div id="inscrits">
    <app-afficher-inscrit-card
      [inscrit]="match.inscritA"
      [couleur]="match.couleurA"
      [score]="match.scoreA"
    ></app-afficher-inscrit-card>
    <app-afficher-inscrit-card
      [inscrit]="match.inscritB"
      [couleur]="match.couleurB"
      [score]="match.scoreB"
    ></app-afficher-inscrit-card>
  </div>
  <app-historique-coups
    [role]=role
    [matchId]="matchId"
  ></app-historique-coups>
  } @else {
  <div>Chargement du match</div>
  }
</main>
