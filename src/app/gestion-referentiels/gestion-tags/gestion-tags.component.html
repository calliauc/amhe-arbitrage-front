<main>
  <table>
    <thead>
      <tr>
        <th class="col">Item</th>
        <th class="col"></th>
      </tr>
    </thead>
    @for (tag of tagsListe$ | async; track $index; let estPair = $even) {
    <app-tag-ligne
      (supprimerTag)="supprimerTag($event)"
      (modifierTag)="modifierTag($event)"
      [role]="role"
      [estPair]="estPair"
      [tag]="tag"
    ></app-tag-ligne>
    } @if (estModeCreation) {
    <app-tag-editer
      (annulerEditionCreation)="annulerEdition()"
      (validerCreation)="creerTag()"
    ></app-tag-editer>
    }
  </table>
  @if (!estModeCreation && Auth.noAuth(role)) {
  <button class="btn" id="ajouter-tag" (click)="modeAjout()">
    Ajouter tag
  </button>
  }
</main>
