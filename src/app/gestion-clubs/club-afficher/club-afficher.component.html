<tr [ngClass]="{ lignePair: estPair }">
  <td class="col">{{ club.ville }}</td>
  <td class="col">{{ club.nomCourt }}</td>
  <td class="col">{{ club.nomComplet }}</td>
  <td class="col">
    <button class="btn btn-clubs btn-afficher-details" disabled>Détails</button>
     @if (Auth.estAdmin(role)) {
    <button class="btn btn-clubs btn-editer-club" (click)="editer()">
      Editer</button
    >}
  </td>
</tr>
