@if (estModif) {
<app-inscrit-editer
  [estPair]="estPair"
  [inscrit]="inscrit"
  (annulerEdition)="modifInscritAnnulee()"
  (supprimerInscrit)="suppressionInscrit($event)"
></app-inscrit-editer>
} @else {
<app-inscrit-afficher
  [estPair]="estPair"
  [inscrit]="inscrit"
  [role]="role"
  (editerInscrit)="lancerEdition()"
></app-inscrit-afficher>
}
