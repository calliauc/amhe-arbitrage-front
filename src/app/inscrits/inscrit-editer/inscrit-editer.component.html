<form
  [formGroup]="formEditerInscrit"
  (ngSubmit)="confirmer()"
  (keypress.enter)="confirmer()"
  (keypress.escape)="annuler()"
>
  <tr [ngClass]="{ lignePair: estPair }">
    <td class="col">
      <input
        class="input-txt"
        type="text"
        formControlName="prenom"
        placeholder="Prénom"
        #focus
      />
    </td>
    <td class="col">
      <input
        class="input-txt"
        type="text"
        formControlName="nom"
        placeholder="Nom"
      />
    </td>
    <td class="col">
      <select name="club" formControlName="club">
        @for (club of clubsListe; track $index){
        <option [ngValue]="club">{{ club.nomComplet }}</option>
        }
      </select>
    </td>
    <td class="col btns">
      @if (inscrit.id){
      <button
        type="button"
        class="btn btn-inscrits btn-suppression"
        (click)="demanderSuppression()"
      >
        X</button
      >}
      <button class="btn btn-inscrits btn-enregistrer-edition" type="submit">
        Valider
      </button>
      <button
        type="button"
        class="btn btn-inscrits btn-annuler-edition"
        (click)="annuler()"
      >
        Annuler
      </button>
    </td>
  </tr>
  @if (ereurSaisie){
  <div class="bandeau-erreur">
    <div class="message-erreur">Certains champs sont vides</div>
  </div>
  }
</form>
@if (estModalVisible && inscrit.id){
<app-confirmation-modal
  [id]="inscrit.id"
  [titre]="titreModal"
  [texte]="texteModal"
  (confirmer)="confirmerSuppression($event)"
  (annuler)="annulerSuppression()"
></app-confirmation-modal>
}
