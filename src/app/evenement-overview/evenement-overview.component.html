@if (evenement$ | async) {
  <div id="head">
    <h1>{{ (evenement$ | async)?.nom }}</h1>
    <div class="date">
      <span>Du </span>
      <span>{{ (evenement$ | async)?.dateDebut | date:'shortDate' }}</span>
      <span> au </span>
      <span>{{ (evenement$ | async)?.dateFin | date:'shortDate' }}</span>
    </div>
  </div>
} @else {
  <div>Aucun event chargé</div>
}
