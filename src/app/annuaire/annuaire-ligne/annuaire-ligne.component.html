@if (estModif) {
<app-annuaire-editer
  [estPair]="estPair"
  [individu]="individu"
  (annulerEditionCreation)="modifIndividuAnnulee()"
  (supprimerIndividu)="suppressionIndividu($event)"
  (validerEdition)="modifIndividuTerminee($event)"
></app-annuaire-editer>
} @else {
<app-annuaire-afficher
  [estPair]="estPair"
  [individu]="individu"
  [role]="role"
  (editerIndividu)="lancerEdition()"
></app-annuaire-afficher>
}
