<div id="login">
    @if (estLog) {
    <button id="btn-lock" class="btn-login" (click)="verouiller()"></button>
  } @else {
    <button id="btn-unlock" class="btn-login" (click)="ouvrirModaleSecu()"></button>
  }
</div>
@if (estModateSecuVisible) {
  <app-password-modal
    [code]="'refs'"
    (confirmer)="deverouiller()"
    (annuler)="fermerModaleSecu()"
  ></app-password-modal>
}
